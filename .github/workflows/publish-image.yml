# T-0021 / ADR-0035 + ADR-0044: PR CI builds the BFF image without signing
# access. Only protected-main publication can read the cosign key.
name: Publish BFF image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build BFF image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  publish:
    name: publish signed BFF image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: image-publish
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gitfrok/bff:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: sign immutable digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ghcr.io/gitfrok/bff@${{ steps.image.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE"
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/gitfrok/bff@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/bff.spdx.json
      - name: attest SBOM
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ghcr.io/gitfrok/bff@${{ steps.image.outputs.digest }}
          PREDICATE: ${{ runner.temp }}/bff.spdx.json
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate "$PREDICATE" "$IMAGE"
      - name: Grype scan (report)
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/gitfrok/bff@${{ steps.image.outputs.digest }}
          fail-build: false
          output-format: table

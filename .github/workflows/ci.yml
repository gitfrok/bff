# T-0002 AC3/AC5: the BFF boundary gate runs on every PR and blocks merge on violation. The BFF
# aggregates only (invariant 18) and never imports backend Go code (invariant 22, ADR-0027).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: build + vet + arch gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Floor comes from go.mod (ADR-0023 pins Go 1.26); keep the two in step.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # The boundary gate. internal/arch scans the real tree AND proves each forbidden import is
      # caught by a fixture, so the gate cannot pass vacuously.
      - name: architecture boundary gates
        run: go test ./internal/arch/... -v

      - name: go test
        run: go test ./...
